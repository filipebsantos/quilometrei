services:
  webserver:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: webserver
    networks:
      - "quilometrei_network"
    ports:
      - "80:80"

  quilometrei_app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    container_name: quilometrei_app
    networks:
      - "quilometrei_network"

networks:
  quilometrei_network:
    name: "quilometrei_network"